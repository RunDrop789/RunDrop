<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunDrop - สมัครเป็นพาร์ทเนอร์คนขับ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

  <div class="w-full bg-white border-b border-gray-200">
    <div class="max-w-2xl mx-auto px-4 pt-4 pb-3 text-center">
      <img src="banner.jpg" alt="RunDrop Banner"
        class="block mx-auto w-full max-w-sm md:max-w-md h-auto rounded-2xl shadow-md">
      <h1 class="text-xl md:text-2xl font-black text-green-900 mt-3 leading-tight">สมัครเป็นพาร์ทเนอร์คนขับ RunDrop</h1>
      <p class="text-[11px] md:text-xs font-bold text-green-800 leading-tight">กรอกข้อมูลและแนบเอกสารให้ครบ ทีมงานจะตรวจสอบและติดต่อกลับ</p>
    </div>
  </div>

  <main class="max-w-md mx-auto p-4 pb-12">
    <div class="bg-white rounded-2xl shadow-md p-4 space-y-4">
      <form id="driverForm" class="space-y-4">

        <h2 class="text-base font-bold text-green-900 border-b pb-2">ข้อมูลส่วนตัว</h2>

        <div>
          <label class="block text-xs font-bold mb-1">ชื่อ-นามสกุล *</label>
          <input type="text" id="fullName" required placeholder="ชื่อ-นามสกุลตามบัตรประชาชน"
            class="w-full border border-gray-300 rounded-lg p-2 text-xs focus:outline-none focus:border-green-600">
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">เบอร์โทรศัพท์ *</label>
          <input type="tel" id="phone" required placeholder="0812345678"
            class="w-full border border-gray-300 rounded-lg p-2 text-xs focus:outline-none focus:border-green-600">
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">เลขบัตรประชาชน 13 หลัก *</label>
          <input type="text" id="idCard" required inputmode="numeric" maxlength="13" placeholder="1234567890123"
            class="w-full border border-gray-300 rounded-lg p-2 text-xs focus:outline-none focus:border-green-600">
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">ประเภทรถที่ขับ *</label>
          <select id="vehicleType" required
            class="w-full border border-gray-300 rounded-lg p-2 text-xs bg-white focus:outline-none focus:border-green-600">
            <option value="">-- เลือกประเภทรถ --</option>
            <option value="Motorcycle">มอเตอร์ไซค์ (Motorcycle)</option>
            <option value="Sedan">รถเก๋ง (Sedan)</option>
            <option value="Hatchback">รถแฮทช์แบ็ก (Hatchback)</option>
            <option value="SUV">รถ SUV (SUV)</option>
            <option value="Pickup">รถกระบะทั่วไป (Pickup)</option>
            <option value="Box Pickup">กระบะตู้ทึบ (Box Pickup)</option>
            <option value="Fence Pickup">รถกระบะคอก (Fence Pickup)</option>
            <option value="Box Truck">รถบรรทุกตู้ทึบ (Box Truck)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">ทะเบียนรถ *</label>
          <input type="text" id="plateNumber" required placeholder="เช่น กข 1234 กทม"
            class="w-full border border-gray-300 rounded-lg p-2 text-xs focus:outline-none focus:border-green-600">
        </div>

        <h2 class="text-base font-bold text-green-900 border-b pb-2 pt-2">เอกสารยืนยันตัวตน</h2>

        <div>
          <label class="block text-xs font-bold mb-1">1. รูปถ่ายบัตรประชาชน *</label>
          <input type="file" id="fileIdCard" accept="image/*" required
            class="w-full text-xs file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-yellow-100 file:text-green-800 file:font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">2. รูปถ่ายใบขับขี่ *</label>
          <input type="file" id="fileLicense" accept="image/*" required
            class="w-full text-xs file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-yellow-100 file:text-green-800 file:font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">3. ใบตรวจประวัติอาชญากรรม *</label>
          <input type="file" id="fileCriminal" accept="image/*" required
            class="w-full text-xs file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-yellow-100 file:text-green-800 file:font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">4. รูปถ่ายหน้าคนขับ *</label>
          <input type="file" id="fileSelfie" accept="image/*" required
            class="w-full text-xs file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-yellow-100 file:text-green-800 file:font-bold">
          <p class="text-[10px] text-gray-500 mt-1">ถ่ายหน้าตรง ไม่สวมหมวกหรือแว่นกันแดด เห็นใบหน้าชัดเจน</p>
        </div>

        <label class="flex items-start gap-2 text-[11px] text-gray-700">
          <input type="checkbox" id="consent" required class="mt-0.5 w-4 h-4 accent-green-600">
          <span>ข้าพเจ้ายินยอมให้ RunDrop เก็บและใช้เอกสารและรูปถ่ายข้างต้นเพื่อยืนยันตัวตนและตรวจสอบคุณสมบัติคนขับเท่านั้น โดยเก็บไว้ไม่เกินระยะเวลาที่จำเป็น</span>
        </label>

        <p class="text-[10px] text-gray-500">ข้อมูลส่วนบุคคลจะใช้เพื่อยืนยันตัวตนคนขับเท่านั้น</p>

        <p id="formMessage" class="text-xs text-center min-h-[1rem]"></p>

        <button type="submit" id="submitBtn"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl shadow-md transition text-sm disabled:opacity-60">
          ส่งใบสมัครคนขับ
        </button>
      </form>
    </div>
  </main>

  <!-- Modal ผลลัพธ์ -->
  <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-50 items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl space-y-3">
      <div id="resultIcon" class="text-5xl">✅</div>
      <h3 id="resultTitle" class="text-base font-black text-green-900">ส่งใบสมัครเรียบร้อย</h3>
      <p id="resultText" class="text-xs text-gray-600 leading-relaxed"></p>
      <div id="resultStatus" class="inline-block text-[11px] font-bold px-3 py-1 rounded-full bg-yellow-100 text-yellow-800">สถานะ: รอตรวจสอบ</div>
      <button type="button" id="resultClose"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg text-xs transition">
        ตกลง
      </button>
    </div>
  </div>

  <script>
    const LIFF_ID = '2012603605-2lSXUvu0';
    const DOCS = [
      { inputId: 'fileIdCard',   docType: 'id_card',         label: 'รูปถ่ายบัตรประชาชน' },
      { inputId: 'fileLicense',  docType: 'driver_license',  label: 'รูปถ่ายใบขับขี่' },
      { inputId: 'fileCriminal', docType: 'criminal_record', label: 'ใบตรวจประวัติอาชญากรรม' },
      { inputId: 'fileSelfie',   docType: 'selfie',          label: 'รูปถ่ายหน้าคนขับ' }
    ];
    const LIMIT_BYTES = 2.5 * 1024 * 1024;
    let idToken = null;

    function showMessage(text, isError = false) {
      const el = document.getElementById('formMessage');
      el.textContent = text;
      el.className = 'text-xs text-center min-h-[1rem] ' + (isError ? 'text-red-600' : 'text-green-700');
    }

    function showResult({ ok, title, text, status }) {
      document.getElementById('resultIcon').textContent = ok ? '✅' : '❌';
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultText').textContent = text;
      const st = document.getElementById('resultStatus');
      if (status) {
        st.textContent = 'สถานะ: ' + status;
        st.classList.remove('hidden');
      } else {
        st.classList.add('hidden');
      }
      const modal = document.getElementById('resultModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function hideResult() {
      const modal = document.getElementById('resultModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    document.getElementById('resultClose').addEventListener('click', () => {
      hideResult();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function readAsBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1]);
        reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
        reader.readAsDataURL(blob);
      });
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('อ่านรูปไม่สำเร็จ (ไฟล์อาจไม่ใช่รูปภาพ)'));
        img.src = URL.createObjectURL(file);
      });
    }

    async function compressImage(file, maxSize, quality) {
      const img = await loadImage(file);
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
    }

    async function compressUnder(file) {
      let blob = await compressImage(file, 1600, 0.8);
      for (const [size, q] of [[1400, 0.7], [1200, 0.6], [1000, 0.5]]) {
        if (blob.size <= LIMIT_BYTES) break;
        blob = await compressImage(file, size, q);
      }
      if (blob.size > LIMIT_BYTES) throw new Error('รูปยังใหญ่เกินไป กรุณาถ่ายใหม่ให้ชัดแต่ขนาดเล็กลง');
      return blob;
    }

    function validateFiles() {
      for (const d of DOCS) {
        const file = document.getElementById(d.inputId).files[0];
        if (!file) return `กรุณาเลือก${d.label}`;
        if (!file.type.startsWith('image/')) return `${d.label} ต้องเป็นไฟล์รูปภาพ`;
      }
      return null;
    }

    // เช็กสถานะตอนเปิดหน้า: แสดงสถานะ/ชื่อ และซ่อนฟอร์มถ้าส่งครบแล้ว
    async function checkStatus() {
      const res = await fetch('/api/driver?action=status', {
        headers: { 'x-line-id-token': idToken }
      });
      const st = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(st.error || 'ตรวจสถานะไม่สำเร็จ');

      if (!st.registered) return;

      if (st.status === 'APPROVED') {
        showResult({ ok: true, title: `สวัสดีคุณ ${st.name}`, text: 'บัญชีของคุณได้รับการอนุมัติแล้ว', status: 'อนุมัติแล้ว' });
        document.getElementById('driverForm').classList.add('hidden');
      } else if (st.status === 'PENDING' && st.docCount >= DOCS.length) {
        showResult({ ok: true, title: `สวัสดีคุณ ${st.name}`, text: 'ใบสมัครของคุณได้รับแล้ว อยู่ระหว่างการตรวจสอบ ไม่สามารถส่งซ้ำได้', status: 'รอตรวจสอบ' });
        document.getElementById('driverForm').classList.add('hidden');
      } else if (st.status === 'REJECTED') {
        showResult({ ok: false, title: 'ใบสมัครไม่ผ่าน', text: 'เหตุผล: ' + (st.rejectReason || '-') + ' กรุณาแก้ไขแล้วส่งใหม่', status: 'ไม่ผ่าน' });
      }
    }

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        idToken = liff.getIDToken();
        await checkStatus();
      } catch (err) {
        showMessage('ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาเปิดจากลิงก์ LIFF', true);
      }
    }

    document.getElementById('driverForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showMessage('');
      if (!idToken) { showMessage('ยังไม่ได้เชื่อมต่อ LINE กรุณาลองใหม่', true); return; }

      const idCard = document.getElementById('idCard').value.trim();
      if (!/^\d{13}$/.test(idCard)) { showMessage('เลขบัตรประชาชนต้องมี 13 หลัก', true); return; }
      if (!document.getElementById('consent').checked) { showMessage('กรุณายินยอมก่อนส่งใบสมัคร', true); return; }

      const fileError = validateFiles();
      if (fileError) { showMessage(fileError, true); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังส่งใบสมัคร...';

      try {
        // 1) บันทึกข้อมูลส่วนตัว
        const regRes = await fetch('/api/driver?action=register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-line-id-token': idToken },
          body: JSON.stringify({
            name: document.getElementById('fullName').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            idCard,
            vehicleType: document.getElementById('vehicleType').value,
            plateNumber: document.getElementById('plateNumber').value.trim()
          })
        });
        const regBody = await regRes.json().catch(() => ({}));
        if (!regRes.ok && !(regRes.status === 409 && regBody.code === 'REJECTED')) {
          throw new Error(regBody.error || 'ส่งใบสมัครไม่สำเร็จ');
        }

        // 2) ย่อรูปอัตโนมัติแล้วอัปโหลดทีละรายการ
        for (const d of DOCS) {
          const original = document.getElementById(d.inputId).files[0];
          btn.textContent = `กำลังอัปโหลด ${d.label}...`;
          const blob = await compressUnder(original);
          const data = await readAsBase64(blob);
          const res = await fetch('/api/driver?action=upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-line-id-token': idToken },
            body: JSON.stringify({ docType: d.docType, mimeType: 'image/jpeg', data })
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(`${d.label}: ${body.error || 'อัปโหลดไม่สำเร็จ'}`);
        }

        showResult({
          ok: true,
          title: 'ส่งใบสมัครเรียบร้อย',
          text: 'ขอบคุณที่สมัครเป็นพาร์ทเนอร์ RunDrop ทีมงานจะตรวจสอบเอกสารและติดต่อกลับทางไลน์ภายใน 1-3 วันทำการ',
          status: 'รอตรวจสอบ'
        });
        document.getElementById('driverForm').classList.add('hidden');
      } catch (err) {
        showResult({ ok: false, title: 'ส่งใบสมัครไม่สำเร็จ', text: err.message });
      } finally {
        btn.disabled = false;
        btn.textContent = 'ส่งใบสมัครคนขับ';
      }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
