<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunDrop - หน้าคนขับ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="line-session.js"></script>
  <script src="location-name.js"></script>
  <style>
    @media (max-width: 767px) {
      input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
      textarea,
      select {
        font-size: 16px !important;
      }
    }

    .swipe-thumb { transition: transform .2s ease; }
    .swipe-track.dragging .swipe-thumb { transition: none; }
    #cameraBox,
    #confirmModal,
    #driverCancelModal {
      z-index: 10000;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div class="max-w-md mx-auto p-4 space-y-4 pb-10">

    <!-- โปรไฟล์ -->
    <div class="bg-white rounded-2xl shadow p-4 flex items-center gap-3">
      <img id="selfie" class="w-16 h-16 rounded-full object-cover bg-gray-200" alt="">
      <div class="flex-1 min-w-0">
        <p id="name" class="font-bold text-green-900 truncate">กำลังโหลด...</p>
        <p id="vehicle" class="text-[11px] text-gray-500"></p>
      </div>
      <label id="onlineWrap" class="hidden flex items-center gap-2 text-xs font-bold">
        <input type="checkbox" id="onlineToggle" class="w-5 h-5 accent-green-600">พร้อมรับงาน
      </label>
    </div>

    <p id="msg" class="text-xs text-center text-red-600 min-h-[1rem]"></p>

    <!-- สถานะใบสมัคร (ยังไม่อนุมัติ) -->
    <div id="regCard" class="hidden bg-white rounded-2xl shadow p-4 space-y-2">
      <h2 class="font-bold text-green-900">สถานะใบสมัคร</h2>
      <p id="regStatus" class="text-sm font-bold"></p>
      <p id="regReason" class="text-xs text-red-600"></p>
      <ul id="docList" class="text-xs space-y-1"></ul>
    </div>

    <!-- ส่วนหลักเมื่อได้รับอนุมัติ -->
    <div id="dashboard" class="hidden space-y-4">

      <!-- งานที่กำลังทำ (สูงสุด 2 งาน) -->
      <div id="activeList" class="space-y-4"></div>

      <!-- Camera capture modal -->
      <div id="cameraBox" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/60 p-4"
        role="dialog" aria-modal="true" aria-labelledby="cameraTitle">
        <div class="w-full max-w-sm max-h-[calc(100vh-2rem)] overflow-y-auto rounded-2xl bg-white p-4 shadow-xl space-y-3">
          <p id="cameraTitle" class="text-sm font-bold text-green-900"></p>
          <video id="camVideo" autoplay playsinline muted class="w-full rounded-xl bg-black h-56 max-h-[55vh] object-cover"></video>
          <canvas id="camCanvas" class="hidden"></canvas>
          <div class="flex gap-2">
            <button id="camShoot" class="flex-1 bg-green-600 text-white text-sm font-bold py-3 rounded-lg">📷 ถ่ายรูป</button>
            <button id="camCancel" class="flex-1 bg-gray-200 text-sm font-bold py-3 rounded-lg">ยกเลิก</button>
          </div>
        </div>
      </div>

      <button id="statsToggle" type="button" class="w-full rounded-xl bg-white py-3 text-sm font-bold text-green-800 shadow" aria-expanded="false">ดูสถิติ</button>
      <div id="statsPanel" class="hidden bg-white rounded-2xl shadow p-4 space-y-3">
        <div class="flex gap-2 text-xs font-bold">
          <button data-g="day" class="gbtn flex-1 py-1 rounded-lg">รายวัน</button>
          <button data-g="week" class="gbtn flex-1 py-1 rounded-lg">รายสัปดาห์</button>
          <button data-g="month" class="gbtn flex-1 py-1 rounded-lg">รายเดือน</button>
        </div>
        <div id="bars" class="flex items-end gap-[2px] h-28"></div>
        <div id="barLabels" class="flex text-[9px] text-gray-400"></div>
        <p id="barDetail" class="text-xs text-center font-bold"></p>
        <p id="totals" class="text-[11px] text-gray-500 text-center"></p>
        <p class="text-[10px] text-gray-400 text-center">ย้อนหลัง 3 เดือน · ยอดเป็นค่าบริการของงาน ยังไม่หักค่าแพลตฟอร์ม</p>
      </div>

      <!-- งานที่รับได้ -->
      <div>
        <h2 class="font-bold text-green-900 mb-2">งานที่รับได้</h2>
        <div id="orderList" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- Modal ยืนยันการทำงาน -->
  <div id="confirmModal" class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 text-center space-y-3">
      <p id="confirmText" class="text-sm font-bold"></p>
      <div class="flex gap-2">
        <button id="confirmNo" class="w-1/2 bg-gray-200 py-2 rounded-lg text-xs font-bold">ยกเลิก</button>
        <button id="confirmYes" class="w-1/2 bg-green-600 text-white py-2 rounded-lg text-xs font-bold">ยืนยัน</button>
      </div>
    </div>
  </div>

  <div id="driverCancelModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/60 p-4" role="dialog" aria-modal="true" aria-labelledby="driverCancelTitle">
    <div class="w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl space-y-3">
      <h2 id="driverCancelTitle" class="text-sm font-bold text-red-700">ยกเลิกงาน</h2>
      <p class="text-xs text-gray-600">งานจะถูกยกเลิกและลูกค้าต้องเรียกรถใหม่ กรุณาระบุเหตุผล ระบบจะบันทึกไว้ในแชท</p>
      <textarea id="driverCancelReason" maxlength="250" rows="3" class="w-full rounded-lg border p-2 text-sm" placeholder="เหตุผลที่ยกเลิก"></textarea>
      <p id="driverCancelError" class="hidden text-xs text-red-600"></p>
      <div class="flex gap-2">
        <button id="driverCancelDismiss" type="button" class="flex-1 rounded-lg bg-gray-200 py-2 text-xs font-bold">กลับ</button>
        <button id="driverCancelConfirm" type="button" class="flex-1 rounded-lg bg-red-600 py-2 text-xs font-bold text-white">ยืนยันยกเลิก</button>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = window.LIFF_ID_DRIVER;
    const TZ = 'Asia/Bangkok';
    const MAX_ACTIVE = 2;
    const STATUS_TH = { ACCEPTED: 'รับงานแล้ว กำลังไปรับของ', PICKED_UP: 'รับของแล้ว กำลังไปส่ง', DELIVERED: 'ส่งแล้ว' };
    const NEXT = { ACCEPTED: { to: 'PICKED_UP', label: 'รับสินค้าแล้ว' }, PICKED_UP: { to: 'DELIVERED', label: 'ส่งสินค้าแล้ว' } };
    const DOC_TH = { id_card: 'บัตรประชาชน', driver_license: 'ใบขับขี่', criminal_record: 'ใบตรวจประวัติอาชญากรรม', selfie: 'รูปถ่ายหน้า' };
    const SWIPE_THRESHOLD = 0.85;
    function getLiffOrderParams() {
      const params = new URLSearchParams(location.search);
      const state = params.get('liff.state') || '';
      const queryStart = state.indexOf('?');
      const stateQuery = queryStart >= 0
        ? state.slice(queryStart + 1)
        : state.replace(/^[?#]/, '');
      const stateParams = new URLSearchParams(stateQuery.split('#')[0]);
      const getId = value => {
        const id = Number(value);
        return Number.isSafeInteger(id) && id > 0 ? id : null;
      };
      const acceptOrderId = getId(params.get('acceptOrderId') || stateParams.get('acceptOrderId'));
      return {
        acceptOrderId,
        orderId: getId(params.get('orderId') || stateParams.get('orderId')) || acceptOrderId
      };
    }
    function clearAutoAcceptFromUrl() {
      const url = new URL(location.href);
      url.searchParams.delete('acceptOrderId');
      const state = url.searchParams.get('liff.state');
      if (state) {
        const queryStart = state.indexOf('?');
        const path = queryStart >= 0 ? state.slice(0, queryStart) : '';
        const rawQuery = queryStart >= 0 ? state.slice(queryStart + 1) : state;
        const stateParams = new URLSearchParams(rawQuery.split('#')[0].replace(/^[?#]/, ''));
        stateParams.delete('acceptOrderId');
        const remaining = stateParams.toString();
        if (path || remaining) {
          url.searchParams.set('liff.state', path + (remaining ? `?${remaining}` : ''));
        } else {
          url.searchParams.delete('liff.state');
        }
      }

      window.history.replaceState(window.history.state, '', `${url.pathname}${url.search}${url.hash}`);
    }
    function focusLinkedOrderCard() {
      if (!linkedOrderId || linkedOrderFocused) return;
      const card = document.querySelector(`[data-job-card="${linkedOrderId}"], [data-order="${linkedOrderId}"]`);
      if (!card) return;
      linkedOrderFocused = true;
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('ring-2', 'ring-green-500');
      setTimeout(() => card.classList.remove('ring-2', 'ring-green-500'), 5000);
    }
    const initialLiffOrderParams = getLiffOrderParams();
    let linkedOrderId = initialLiffOrderParams.orderId;
    let lineAutoAcceptOrderId = initialLiffOrderParams.acceptOrderId;

    let idToken = null, activeOrders = [], history = [], gran = 'day', selectedKey = null;
    let linkedOrderFocused = false;
    let renderedActiveSignature = null, refreshInProgress = false, refreshQueued = false;
    let pendingAction = null, pendingCancelOrderId = null, camStream = null, camCallback = null;
    let pollTimer = null, rt = null, rtClient = null, realtimeTimer = null, realtimeRetryTimer = null;
    const maps = {};        // orderId -> { map, layer, reqId }
    const chatTimers = {};  // orderId -> interval id
    const seenOrderIds = new Set();
    let audioCtx = null, pendingNotificationSound = false;

    const $ = id => document.getElementById(id);
    const say = t => { $('msg').textContent = t || ''; };
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function withTimeout(promise, ms, message) {
      let timeout;
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          timeout = setTimeout(() => reject(new Error(message)), ms);
        })
      ]).finally(() => clearTimeout(timeout));
    }

    async function api(path, opt = {}) {
      const currentToken = liff.getIDToken();
      if (currentToken) idToken = currentToken;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const res = await fetch(path, {
          ...opt,
          signal: controller.signal,
          headers: { 'Content-Type': 'application/json', 'x-line-id-token': idToken, ...(opt.headers || {}) }
        });
        const body = await res.json().catch(() => ({}));
        if (res.status === 401 && /token/i.test(body.error || '') &&
            RunDropLineSession.reauthenticateOnce('rundrop_driver_token_retry')) {
          throw new Error('กำลังเชื่อมต่อ LINE ใหม่...');
        }
        if (!res.ok) throw new Error(body.error || 'เกิดข้อผิดพลาด');
        RunDropLineSession.markFresh('rundrop_driver_token_retry');
        return body;
      } catch (err) {
        if (err.name === 'AbortError') throw new Error('เซิร์ฟเวอร์ตอบช้าเกินไป กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่');
        throw err;
      } finally {
        clearTimeout(timeout);
      }
    }

    // ---------- เสียงแจ้งเตือนเมื่อมีงานใหม่ ----------
    function unlockAudio() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          console.error('Web Audio API is unavailable');
          return;
        }
        audioCtx = audioCtx || new AudioContextClass();
        const resume = audioCtx.state === 'running' ? Promise.resolve() : audioCtx.resume();
        resume.then(() => {
          if (audioCtx.state !== 'running') return;
          document.removeEventListener('pointerdown', unlockAudio);
          if (pendingNotificationSound) {
            pendingNotificationSound = false;
            playNotificationTone();
          }
        }).catch(error => console.error('notification audio resume failed:', error));
      } catch (error) {
        console.error('notification audio initialization failed:', error);
      }
    }

    document.addEventListener('pointerdown', unlockAudio);

    function playNotificationTone() {
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.frequency.value = 880;
      gain.gain.value = 0.15;
      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.4);
    }

    function beep() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          console.error('Web Audio API is unavailable');
          return;
        }
        audioCtx = audioCtx || new AudioContextClass();
        if (audioCtx.state !== 'running') {
          pendingNotificationSound = true;
          audioCtx.resume().then(() => {
            if (audioCtx.state === 'running' && pendingNotificationSound) {
              pendingNotificationSound = false;
              playNotificationTone();
            }
          }).catch(error => console.error('notification sound failed:', error));
          return;
        }
        playNotificationTone();
      } catch (error) {
        console.error('notification sound failed:', error);
      }
    }
    function notifyNew(orders) {
      const fresh = orders.filter(o => !seenOrderIds.has(o.id));
      orders.forEach(o => seenOrderIds.add(o.id));
      if (fresh.length) {
        beep();
        document.title = `(${fresh.length}) RunDrop - หน้าคนขับ`;
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        document.title = 'RunDrop - หน้าคนขับ';
        scheduleRealtimeRefresh();
      }
    });

    // ---------- Realtime: ใช้เป็นสัญญาณเท่านั้น ข้อมูลจริงมาจาก API ----------
    function scheduleRealtimeRefresh() {
      clearTimeout(realtimeTimer);
      realtimeTimer = setTimeout(() => {
        if (refreshInProgress) {
          refreshQueued = true;
          return;
        }
        refresh().catch(err => say(err.message));
      }, 250);
    }

    function retryRealtime() {
      if (realtimeRetryTimer) return;
      realtimeRetryTimer = setTimeout(() => {
        realtimeRetryTimer = null;
        startRealtime();
      }, 5000);
    }

    function startRealtime() {
      if (rt) return;
      try {
        rtClient = rtClient || supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        const channel = rtClient.channel('orders-signal');
        rt = channel;
        channel
          .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
            scheduleRealtimeRefresh();
          })
          .subscribe((status, err) => {
            if (status === 'SUBSCRIBED') {
              clearTimeout(realtimeRetryTimer);
              realtimeRetryTimer = null;
              scheduleRealtimeRefresh();
            } else if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status)) {
              console.error('realtime subscribe failed:', err || status);
              if (rt !== channel) return;
              rt = null;
              rtClient.removeChannel(channel).catch(removeError => {
                console.error('realtime channel cleanup failed:', removeError);
              });
              retryRealtime();
            }
          });
      } catch (error) {
        rt = null;
        console.error('realtime setup failed:', error);
        retryRealtime();
      }
    }

    // ---------- สถานะใบสมัคร / โปรไฟล์ ----------
    async function loadStatus() {
      const st = await api('/api/driver?action=status');
      if (!st.registered) {
        $('regCard').classList.remove('hidden');
        $('regStatus').textContent = 'ยังไม่ได้สมัครคนขับ';
        $('regReason').textContent = 'กรุณาสมัครผ่านลิงก์สมัครคนขับ RunDrop';
        return false;
      }
      $('name').textContent = st.name;
      $('vehicle').textContent = `${st.vehicleType} · ${st.plateNumber}`;
      if (st.selfieUrl) $('selfie').src = st.selfieUrl;

      if (st.status !== 'APPROVED') {
        const label = { PENDING: 'รอตรวจสอบ', REJECTED: 'ไม่ผ่าน' }[st.status] || st.status;
        $('regCard').classList.remove('hidden');
        $('regStatus').textContent = 'สถานะ: ' + label;
        $('regReason').textContent = st.status === 'REJECTED'
          ? 'เหตุผล: ' + (st.rejectReason || '-') + ' (กรุณาส่งเอกสารใหม่ผ่านลิงก์สมัครคนขับ)' : '';
        $('docList').innerHTML = st.docs.map(d => `<li>${d.uploaded ? '✅' : '❌'} ${DOC_TH[d.type]}</li>`).join('');
        return false;
      }

      $('onlineWrap').classList.remove('hidden');
      $('onlineToggle').checked = st.isOnline;
      return true;
    }

    // ---------- งานที่กำลังทำ ----------
    async function loadJobs() {
      const d = await api('/api/driver?action=jobs');
      history = d.history;
      activeOrders = d.active || [];
      renderActive();
      renderStats();
    }

    function navTarget(o) {
      if (o.status === 'ACCEPTED') return { lat: o.pickup_lat, lng: o.pickup_lng };
      return { lat: o.dropoff_lat, lng: o.dropoff_lng };
    }

    function needsLocationLookup(place) {
      const text = String(place || '').trim();
      return !text || /^(?:พิกัด\s*:\s*)?-?\d+(?:\.\d+)?\s*,\s*-?\d+(?:\.\d+)?$/i.test(text);
    }

    function locationLabel(place) {
      return needsLocationLookup(place) ? 'กำลังค้นหาที่อยู่...' : esc(place);
    }

    function resolveLocationLabel(order, kind, place, lat, lng) {
      if (!needsLocationLookup(place)) return;
      const target = document.querySelector(
        `[data-location-order="${order.id}"][data-location-kind="${kind}"]`
      );
      if (!target) return;
      if (!window.RunDropLocation?.reverseGeocode) {
        console.error('location lookup is unavailable');
        target.textContent = 'ไม่สามารถค้นหาชื่อสถานที่ได้';
        return;
      }

      window.RunDropLocation.reverseGeocode(lat, lng).then(label => {
        if (target.isConnected) target.textContent = label;
      }).catch(error => {
        console.error('reverse geocoding failed:', error);
        if (target.isConnected) target.textContent = 'ไม่พบชื่อสถานที่';
      });
    }

    function renderActive() {
      const list = $('activeList');
      const ids = new Set(activeOrders.map(o => o.id));
      Object.keys(maps).forEach(id => {
        if (!ids.has(Number(id))) {
          maps[id].map.remove();
          delete maps[id];
        }
      });
      Object.keys(chatTimers).forEach(id => { if (!ids.has(Number(id))) { clearInterval(chatTimers[id]); delete chatTimers[id]; } });

      const signature = JSON.stringify(activeOrders);
      if (signature === renderedActiveSignature) return;
      renderedActiveSignature = signature;

      Object.keys(maps).forEach(id => {
        maps[id].map.remove();
        delete maps[id];
      });

      if (!activeOrders.length) {
        list.innerHTML = '';
        closeCamera();
        return;
      }

      list.innerHTML = activeOrders.map(o => {
        const n = NEXT[o.status];
        const t = navTarget(o);
        const hasNav = t.lat != null && t.lng != null;
        const navUrl = hasNav
          ? `https://www.google.com/maps/dir/?api=1&destination=${Number(t.lat)},${Number(t.lng)}&travelmode=driving`
          : '';
        const navText = o.status === 'ACCEPTED' ? '🧭 นำทางไปจุดรับ' : '🧭 นำทางไปจุดส่ง';
        return `
        <div class="bg-white rounded-2xl shadow p-4 space-y-3" data-order="${o.id}">
          <div class="flex justify-between text-xs">
            <span class="font-bold">${esc(o.tracking_code)}</span>
            <span class="font-bold text-green-700">${esc(o.price)} ฿</span>
          </div>
          <p class="text-xs font-bold text-green-800">${esc(STATUS_TH[o.status] || o.status)}</p>
          <p class="text-xs">รับ: <span data-location-order="${o.id}" data-location-kind="pickup">${locationLabel(o.pickup_place)}</span></p>
          <p class="text-xs">ส่ง: <span data-location-order="${o.id}" data-location-kind="dropoff">${locationLabel(o.destination)}</span></p>
          <p class="text-xs">ลูกค้า: ${esc(o.customer_name)} · <a href="tel:${esc(o.phone)}" class="text-green-700 font-bold">โทรหาลูกค้า</a></p>
          <div id="map-${o.id}" class="h-48 rounded-xl border"></div>
          ${hasNav ? `<a href="${navUrl}" target="_blank" rel="noopener" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 rounded-lg">${navText}</a>` : ''}
          ${o.status === 'ACCEPTED' ? `<button type="button" data-cancel="${o.id}" class="w-full rounded-lg border border-red-300 bg-red-50 py-2 text-xs font-bold text-red-700">ยกเลิกงาน</button>` : ''}
          ${n ? `<button data-advance="${o.id}" class="w-full bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 rounded-lg">${n.label}</button>` : ''}
          <div>
            <h3 class="text-xs font-bold mb-1">แชทกับลูกค้า</h3>
            <div id="chat-${o.id}" class="h-32 overflow-y-auto border rounded-lg p-2 space-y-1 bg-gray-50"></div>
            <form data-chat="${o.id}" class="flex gap-2 mt-2">
              <input maxlength="300" placeholder="พิมพ์ข้อความ" class="flex-1 border border-gray-300 rounded-lg p-2 text-xs focus:outline-none focus:border-green-600">
              <button class="bg-green-600 text-white text-xs font-bold px-3 rounded-lg">ส่ง</button>
            </form>
          </div>
        </div>`;
      }).join('');

      activeOrders.forEach(o => {
        drawMap(o);
        startChat(o.id);
        resolveLocationLabel(o, 'pickup', o.pickup_place, o.pickup_lat, o.pickup_lng);
        resolveLocationLabel(o, 'dropoff', o.destination, o.dropoff_lat, o.dropoff_lng);
      });
      focusLinkedOrderCard();
    }

    // ---------- เส้นทางตามถนน (OSRM) ----------
    async function fetchRoadRoute(p, d) {
      const url = `https://router.project-osrm.org/route/v1/driving/${p[1]},${p[0]};${d[1]},${d[0]}?overview=full&geometries=geojson`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('OSRM HTTP ' + res.status);
      const data = await res.json();
      if (data.code !== 'Ok' || !data.routes?.length) throw new Error('OSRM no route');
      return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    }

    function drawMap(o) {
      const el = document.getElementById('map-' + o.id);
      if (!el || o.pickup_lat == null || o.dropoff_lat == null) return;
      if (!maps[o.id]) {
        const map = L.map(el);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        maps[o.id] = { map, layer: L.layerGroup().addTo(map), reqId: 0 };
      }
      const m = maps[o.id];
      m.layer.clearLayers();
      const p = [Number(o.pickup_lat), Number(o.pickup_lng)];
      const d = [Number(o.dropoff_lat), Number(o.dropoff_lng)];
      L.circleMarker(p, { radius: 8, color: '#16a34a', fillOpacity: 1 }).bindTooltip('จุดรับ').addTo(m.layer);
      L.circleMarker(d, { radius: 8, color: '#dc2626', fillOpacity: 1 }).bindTooltip('จุดส่ง').addTo(m.layer);
      const straight = L.polyline([p, d], { color: '#16a34a', dashArray: '6 6' }).addTo(m.layer);
      m.map.fitBounds([p, d], { padding: [30, 30] });
      setTimeout(() => m.map.invalidateSize(), 100);

      const reqId = ++m.reqId;
      fetchRoadRoute(p, d).then(latlngs => {
        if (maps[o.id] !== m || reqId !== m.reqId) return;
        straight.remove();
        L.polyline(latlngs, { color: '#16a34a', weight: 5, opacity: 0.8 }).addTo(m.layer);
        m.map.fitBounds(latlngs, { padding: [30, 30] });
      }).catch(() => {});
    }

    // ---------- ถ่ายรูปด้วยกล้องสดเท่านั้น ----------
    async function openCamera(title, onCapture) {
      camCallback = onCapture;
      $('cameraTitle').textContent = title;
      $('cameraBox').classList.remove('hidden');
      $('cameraBox').classList.add('flex');
      document.body.classList.add('overflow-hidden');
      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: 'environment' } }, audio: false
        }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }));
        $('camVideo').srcObject = camStream;
      } catch (e) {
        say('ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง');
        closeCamera();
      }
    }

    function closeCamera() {
      if (camStream) camStream.getTracks().forEach(t => t.stop());
      camStream = null;
      $('camVideo').srcObject = null;
      $('cameraBox').classList.add('hidden');
      $('cameraBox').classList.remove('flex');
      document.body.classList.remove('overflow-hidden');
      camCallback = null;
    }

    $('camCancel').addEventListener('click', closeCamera);
    $('cameraBox').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeCamera();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !$('cameraBox').classList.contains('hidden')) closeCamera();
    });

    $('camShoot').addEventListener('click', () => {
      const v = $('camVideo'), c = $('camCanvas');
      if (!v.videoWidth) return;
      const scale = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight));
      c.width = Math.round(v.videoWidth * scale);
      c.height = Math.round(v.videoHeight * scale);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      c.toBlob(blob => {
        const cb = camCallback;
        closeCamera();
        if (blob && cb) cb(blob);
      }, 'image/jpeg', 0.8);
    });

    async function uploadOrderPhoto(orderId, photoType, blob) {
      const data = await new Promise(resolve => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).split(',')[1]);
        r.readAsDataURL(blob);
      });
      await api('/api/driver?action=photo', {
        method: 'POST',
        body: JSON.stringify({ orderId, photoType, mimeType: 'image/jpeg', data })
      });
    }

    // ---------- ยืนยันขั้นตอนงาน (ถ่ายรูปก่อน) ----------
    $('activeList').addEventListener('click', e => {
      const btn = e.target.closest('[data-advance]');
      if (!btn) return;
      const orderId = Number(btn.dataset.advance);
      const o = activeOrders.find(x => x.id === orderId);
      const n = o && NEXT[o.status];
      if (!n) return;
      const photoType = o.status === 'ACCEPTED' ? 'PICKUP' : 'DROPOFF';
      const label = photoType === 'PICKUP' ? 'ถ่ายรูปตอนรับสินค้า' : 'ถ่ายรูปตอนส่งสินค้า';
      openCamera(label, async blob => {
        try {
          await uploadOrderPhoto(orderId, photoType, blob);
          pendingAction = { orderId, next: n.to };
          $('confirmText').textContent = `ยืนยัน: ${n.label}?`;
          $('confirmModal').classList.remove('hidden');
          $('confirmModal').classList.add('flex');
        } catch (err) { say(err.message); }
      });
    });

    function closeDriverCancelModal() {
      $('driverCancelModal').classList.add('hidden');
      $('driverCancelModal').classList.remove('flex');
      pendingCancelOrderId = null;
    }

    $('activeList').addEventListener('click', e => {
      const btn = e.target.closest('[data-cancel]');

      const order = activeOrders.find(item => item.id === orderId);

      pendingCancelOrderId = orderId;
      $('driverCancelReason').value = '';
      $('driverCancelError').textContent = '';
      $('driverCancelError').classList.add('hidden');
      $('driverCancelModal').classList.remove('hidden');
      $('driverCancelModal').classList.add('flex');
    });

    $('driverCancelDismiss').addEventListener('click', closeDriverCancelModal);
    $('driverCancelModal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeDriverCancelModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !$('driverCancelModal').classList.contains('hidden')) {
        closeDriverCancelModal();
      }
    });
    $('driverCancelConfirm').addEventListener('click', async () => {
      const reason = $('driverCancelReason').value.trim();
      if (!reason) {
        $('driverCancelError').textContent = 'กรุณาระบุเหตุผลในการยกเลิก';

      } catch (err) {

        $('driverCancelError').classList.remove('hidden');

      }

    $('confirmNo').addEventListener('click', () => {
      $('confirmModal').classList.add('hidden');
      $('confirmModal').classList.remove('flex');
    });
    $('confirmYes').addEventListener('click', async () => {
      $('confirmNo').click();
      try {
        await api('/api/driver?action=status-update', { method: 'POST', body: JSON.stringify(pendingAction) });
        say('อัปเดตสถานะแล้ว');
        await refresh();
      } catch (e) { say(e.message); }

    // ---------- แชท (หลายงานพร้อมกัน) ----------
    function startChat(orderId) {
      if (chatTimers[orderId]) return;
      loadChat(orderId);
      chatTimers[orderId] = setInterval(() => loadChat(orderId), 5000);
    }

    async function loadChat(orderId) {
      const box = document.getElementById('chat-' + orderId);
      if (!box) return;
      const { messages } = await api('/api/driver?action=messages&orderId=' + orderId);
      box.innerHTML = messages.length
        ? messages.map(m => `<div class="flex ${m.sender === 'driver' ? 'justify-end' : 'justify-start'}">
            <span class="max-w-[75%] px-2 py-1 rounded-lg text-xs ${m.sender === 'driver' ? 'bg-green-600 text-white' : 'bg-white border'}">${esc(m.body)}</span>
          </div>`).join('')
        : '<p class="text-[11px] text-gray-400 text-center">ยังไม่มีข้อความ</p>';
      box.scrollTop = box.scrollHeight;
    }

    $('activeList').addEventListener('submit', async e => {
      const form = e.target.closest('[data-chat]');
      if (!form) return;
      e.preventDefault();
      const orderId = Number(form.dataset.chat);
      const input = form.querySelector('input');
      const body = input.value.trim();
      if (!body) return;
      try {
        await api('/api/driver?action=messages', { method: 'POST', body: JSON.stringify({ orderId, body }) });
        input.value = '';
        loadChat(orderId);
      } catch (err) { say(err.message); }
    });

    // ---------- สถิติ ----------
    function dayKey(ms) { return new Date(ms).toLocaleDateString('sv-SE', { timeZone: TZ }); }
    function shiftDay(k, n) {
      const d = new Date(k + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    }
    function weekStart(k) {
      const wd = (new Date(k + 'T00:00:00Z').getUTCDay() + 6) % 7;
      return shiftDay(k, -wd);
    }
    function keyOf(ms) {
      const k = dayKey(ms);
      if (gran === 'day') return k;
      if (gran === 'week') return weekStart(k);
      return k.slice(0, 7);
    }
    function bucketKeys() {
      const today = dayKey(Date.now());
      if (gran === 'day') return Array.from({ length: 30 }, (_, i) => shiftDay(today, i - 29));
      if (gran === 'week') return Array.from({ length: 13 }, (_, i) => weekStart(shiftDay(today, (i - 12) * 7)));
      const [y, m] = today.split('-').map(Number);
      return Array.from({ length: 3 }, (_, i) => new Date(Date.UTC(y, m - 1 - (2 - i), 1)).toISOString().slice(0, 7));
    }

    function renderStats() {
      const keys = bucketKeys();
      const agg = {};
      for (const o of history) {
        const k = keyOf(new Date(o.accepted_at).getTime());
        agg[k] ??= { count: 0, sum: 0 };
        agg[k].count++;
        agg[k].sum += Number(o.price) || 0;
      }
      const max = Math.max(1, ...keys.map(k => agg[k]?.count || 0));
      $('bars').innerHTML = keys.map(k => {
        const c = agg[k]?.count || 0;
        const h = c ? Math.max(4, Math.round(c / max * 112)) : 2;
        return `<button data-k="${k}" class="flex-1 rounded-t ${k === selectedKey ? 'bg-green-700' : 'bg-green-400'}" style="height:${h}px"></button>`;
      }).join('');
      $('barLabels').innerHTML = `<span>${keys[0]}</span><span class="ml-auto">${keys[keys.length - 1]}</span>`;

      const sel = selectedKey && keys.includes(selectedKey) ? selectedKey : keys[keys.length - 1];
      selectedKey = sel;
      const a = agg[sel] || { count: 0, sum: 0 };
      $('barDetail').textContent = `${sel}: ${a.count} งาน · ${a.sum.toLocaleString()} ฿`;

      const total = keys.reduce((s, k) => s + (agg[k]?.count || 0), 0);
      const totalSum = keys.reduce((s, k) => s + (agg[k]?.sum || 0), 0);
      $('totals').textContent = `ช่วงที่แสดง รวม ${total} งาน · ${totalSum.toLocaleString()} ฿`;
      document.querySelectorAll('.gbtn').forEach(b => {
        b.classList.toggle('bg-green-600', b.dataset.g === gran);
        b.classList.toggle('text-white', b.dataset.g === gran);
        b.classList.toggle('bg-gray-200', b.dataset.g !== gran);
      });
    }

    $('bars').addEventListener('click', e => {
      if (e.target.dataset.k) { selectedKey = e.target.dataset.k; renderStats(); }
    });
    $('statsToggle').addEventListener('click', () => {
      const expanded = $('statsPanel').classList.contains('hidden');
      $('statsPanel').classList.toggle('hidden', !expanded);
      $('statsToggle').textContent = expanded ? 'ซ่อนสถิติ' : 'ดูสถิติ';
      $('statsToggle').setAttribute('aria-expanded', String(expanded));
      if (expanded) $('statsPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.querySelectorAll('.gbtn').forEach(b => b.addEventListener('click', () => {
      gran = b.dataset.g;
      selectedKey = null;
      renderStats();
    }));

    // ---------- รับงานแบบสไลด์รูด ----------
    function initSwipe(track) {
      const thumb = track.querySelector('.swipe-thumb');
      const maxX = () => Math.max(0, track.clientWidth - thumb.offsetWidth);
      let startX = 0, dragging = false, x = 0;

      const setX = v => {
        x = Math.max(0, Math.min(v, maxX()));
        thumb.style.transform = `translateX(${x}px)`;
      };
      const pointX = e => (e.touches ? e.touches[0].clientX : e.clientX);

      const onStart = e => {
        dragging = true;
        track.classList.add('dragging');
        startX = pointX(e) - x;
      };
      const onMove = e => {
        if (!dragging) return;
        if (e.cancelable) e.preventDefault();
        setX(pointX(e) - startX);
      };
      const onEnd = async () => {
        if (!dragging) return;
        dragging = false;
        track.classList.remove('dragging');
        const max = maxX();
        if (max > 0 && x / max >= SWIPE_THRESHOLD) {
          setX(max);
          try {
            const { order } = await api('/api/driver?action=accept', {
              method: 'POST', body: JSON.stringify({ orderId: Number(track.dataset.id) })
            });
            say(`รับงาน ${order.tracking_code} แล้ว`);
          } catch (err) { say(err.message); }
          await refresh();
        } else {
          setX(0);
        }
      };

      thumb.addEventListener('mousedown', onStart);
      thumb.addEventListener('touchstart', onStart, { passive: true });
      window.addEventListener('mousemove', onMove);
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('mouseup', onEnd);
      window.addEventListener('touchend', onEnd);
    }

    function bindSwipes() {
      document.querySelectorAll('.swipe-track').forEach(t => {
        if (!t.dataset.bound) { t.dataset.bound = '1'; initSwipe(t); }
      });
    }

    // ---------- งานที่รับได้ ----------
    async function loadAvailable() {
      if (activeOrders.length >= MAX_ACTIVE) {
        $('orderList').innerHTML = `<p class="text-xs text-gray-400 text-center py-2">รับได้สูงสุด ${MAX_ACTIVE} งานพร้อมกัน ทำให้เสร็จก่อนรับงานใหม่</p>`;
        return;
      }
      if (!$('onlineToggle').checked) {
        $('orderList').innerHTML = '<p class="text-xs text-gray-400 text-center py-4">เปิดพร้อมรับงานเพื่อดูงานที่รับได้</p>';
        return;
      }
      const { orders } = await api('/api/driver?action=available');
      notifyNew(orders);
      $('orderList').innerHTML = orders.length
        ? orders.map(o => `
          <div data-job-card="${o.id}" class="bg-white rounded-xl shadow p-3 space-y-1">
            <div class="flex justify-between text-xs">
              <span class="font-bold">${esc(o.tracking_code)}</span>
              <span class="font-bold text-green-700">${esc(o.price)} ฿</span>
            </div>
            <p class="text-xs">รับ: <span data-location-order="${o.id}" data-location-kind="pickup">${locationLabel(o.pickup_place)}</span></p>
            <p class="text-xs">ส่ง: <span data-location-order="${o.id}" data-location-kind="dropoff">${locationLabel(o.destination)}</span></p>
            <p class="text-[11px] text-gray-600 font-bold">${o.to_pickup_km != null ? `ห่างคุณ ${esc(o.to_pickup_km)} กม. · ` : ''}รับไปส่ง ${esc(o.distance_km)} กม.</p>
            ${o.customer_note ? `<p class="text-[11px] text-gray-500">หมายเหตุ: ${esc(o.customer_note)}</p>` : ''}
            <div class="swipe-track relative h-10 mt-2 rounded-full bg-green-100 overflow-hidden select-none" data-id="${o.id}">
              <span class="absolute inset-0 flex items-center justify-center text-xs font-bold text-green-800 pointer-events-none">ลากเพื่อรับงาน ➜</span>
              <div class="swipe-thumb absolute left-0 top-0 h-10 w-10 rounded-full bg-green-600 text-white flex items-center justify-center font-bold cursor-grab touch-none">➜</div>
            </div>
          </div>`).join('')
        : '<p class="text-xs text-gray-400 text-center py-4">ยังไม่มีงานใหม่</p>';
      orders.forEach(o => {
        resolveLocationLabel(o, 'pickup', o.pickup_place, o.pickup_lat, o.pickup_lng);
        resolveLocationLabel(o, 'dropoff', o.destination, o.dropoff_lat, o.dropoff_lng);
      });
      bindSwipes();
      focusLinkedOrderCard();
    }

    // ---------- พร้อมรับงาน ----------
    $('onlineToggle').addEventListener('change', async e => {
      const v = e.target.checked;
      try {
        await api('/api/driver?action=online', { method: 'POST', body: JSON.stringify({ isOnline: v }) });
        say(v ? 'พร้อมรับงานแล้ว' : 'หยุดรับงานแล้ว');
        await loadAvailable();
      } catch (err) {
        e.target.checked = !v;
        say(err.message);
      }
    });

    // ---------- GPS คนขับ ----------
    let lastLocation = null;
    let lastLocationSentAt = 0;
    let locationRequestPending = false;

    function distanceBetweenMeters(a, b) {
      const toRad = value => value * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const h = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
      return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }

    function startGps() {
      if (!('geolocation' in navigator)) return;
      navigator.geolocation.watchPosition(
        p => {
          const point = { lat: p.coords.latitude, lng: p.coords.longitude };
          const now = Date.now();
          const movedMeters = lastLocation ? distanceBetweenMeters(lastLocation, point) : Infinity;
          if (locationRequestPending || (movedMeters < 100 && now - lastLocationSentAt < 30000)) return;

          lastLocation = point;
          lastLocationSentAt = now;
          locationRequestPending = true;
          api('/api/driver?action=location', {
            method: 'POST', body: JSON.stringify(point)
          }).catch(() => {
            lastLocationSentAt = 0;
          }).finally(() => {
            locationRequestPending = false;
          });
        },
        () => say('กรุณาอนุญาตตำแหน่ง GPS'),
        { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 }
      );
    }

    // ---------- เริ่มต้น ----------
    async function refresh() {
      if (refreshInProgress) return;
      refreshInProgress = true;
      try {
        if (activeOrders.length >= MAX_ACTIVE) {
          await loadJobs();
          if (activeOrders.length >= MAX_ACTIVE) {
            $('orderList').innerHTML = `<p class="text-xs text-gray-400 text-center py-2">รับได้สูงสุด ${MAX_ACTIVE} งานพร้อมกัน ทำให้เสร็จก่อนรับงานใหม่</p>`;
            return;
          }
          await loadAvailable();
          return;
        }

        const results = await Promise.allSettled([loadJobs(), loadAvailable()]);
        const failed = results.find(result => result.status === 'rejected');
        if (failed) throw failed.reason;
        if (activeOrders.length >= MAX_ACTIVE) {
          $('orderList').innerHTML = `<p class="text-xs text-gray-400 text-center py-2">รับได้สูงสุด ${MAX_ACTIVE} งานพร้อมกัน ทำให้เสร็จก่อนรับงานใหม่</p>`;
        }
      } finally {
        refreshInProgress = false;
        if (refreshQueued) {
          refreshQueued = false;
          scheduleRealtimeRefresh();
        }
      }
    }

    async function init() {
      try {
        say('กำลังเชื่อมต่อ LINE...');
        if (!LIFF_ID) throw new Error('ไม่พบ LIFF ID สำหรับหน้าคนขับ');
        await withTimeout(
          liff.init({ liffId: LIFF_ID }),
          15000,
          'เชื่อมต่อ LINE นานเกินไป กรุณาปิดแล้วเปิดหน้านี้ใหม่'
        );
        const liffOrderParams = getLiffOrderParams();
        linkedOrderId = liffOrderParams.orderId || linkedOrderId;
        lineAutoAcceptOrderId = liffOrderParams.acceptOrderId || lineAutoAcceptOrderId;
        if (!liff.isLoggedIn()) { liff.login(); return; }
        idToken = liff.getIDToken();
        if (!idToken) throw new Error('ไม่พบ LINE ID Token กรุณาเปิดหน้านี้ผ่าน LINE อีกครั้ง');
        say('กำลังโหลดข้อมูลคนขับ...');
        const approved = await loadStatus();
        if (!approved) return;
        $('dashboard').classList.remove('hidden');
        if (lineAutoAcceptOrderId) {
          const orderId = lineAutoAcceptOrderId;
          lineAutoAcceptOrderId = null;
          clearAutoAcceptFromUrl();
          try {
            const { order } = await api('/api/driver?action=accept', {
              method: 'POST',
              body: JSON.stringify({ orderId })
            });
            say(`รับงาน ${order.tracking_code} แล้ว`);
          } catch (error) {
            say(error.message);
          }
        }
        startRealtime();
        refresh().catch(e => say(e.message)).finally(startGps);
        pollTimer = setInterval(() => refresh().catch(err => say(err.message)), 5000);
      } catch (err) {
        say(err.message || 'ไม่สามารถเชื่อมต่อ LINE ได้');
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
